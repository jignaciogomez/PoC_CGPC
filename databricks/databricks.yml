bundle:
  name: random-users-poc

variables:
  cluster_id:
    description: Existing Databricks cluster with Unity Catalog access and internet egress
  catalog_name:
    description: Catalog for this target

workspace:
  host: https://dbc-db5836d9-ab81.cloud.databricks.com
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

targets:
  dev:
    default: true
    mode: development
    variables:
      catalog_name: dev_bronze_ca
  qa:
    mode: production
    variables:
      catalog_name: qa_bronze_ca

resources:
  jobs:
    load_random_users:
      name: random-users-poc-${bundle.target}
      max_concurrent_runs: 1
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
      tasks:
        - task_key: load_random_users
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./notebooks/load_random_users.py
