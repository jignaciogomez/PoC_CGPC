bundle:
  name: random-users-poc

variables:
  cluster_id:
    description: Existing Databricks cluster with Unity Catalog and Azure ABFS access
  storage_account:
    description: Dev ADLS Gen2 storage account name
  file_system:
    description: Dev ADLS Gen2 filesystem name

workspace:
  host: https://dbc-db5836d9-ab81.cloud.databricks.com
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

targets:
  dev:
    default: true
    mode: development

resources:
  jobs:
    load_random_users:
      name: random-users-poc-dev
      max_concurrent_runs: 1
      parameters:
        - name: storage_account
          default: ${var.storage_account}
        - name: file_system
          default: ${var.file_system}
      tasks:
        - task_key: load_random_users
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./notebooks/load_random_users.py
