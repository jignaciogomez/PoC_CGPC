name: Validate Dev example

on:
  pull_request:
  push:
    branches: [Dev]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check ADF source and Dev catalog convention
        run: python scripts/check_example.py
      - name: Compile notebook Python
        run: python -m py_compile databricks/notebooks/load_random_users.py
      - name: Parse bundle YAML
        run: |
          python -m pip install PyYAML
          python -c "import yaml; yaml.safe_load(open('databricks/databricks.yml'))"
