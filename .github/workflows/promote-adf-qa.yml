name: Promote ADF to QA

on:
  push:
    branches: [QA]
    paths:
      - adf/**
      - ci/adf/**
      - deploy/adf-*.parameters.json
      - scripts/prepare_adf_parameters.py
      - scripts/test_adf_source.py
      - .github/workflows/promote-adf-qa.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: qa-adf
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/QA'
    runs-on: ubuntu-latest
    environment: qa
    env:
      DEV_FACTORY_RESOURCE_ID: ${{ vars.DEV_FACTORY_RESOURCE_ID }}
      QA_ADF_RESOURCE_GROUP: ${{ vars.QA_ADF_RESOURCE_GROUP }}
      QA_ADF_FACTORY_NAME: ${{ vars.QA_ADF_FACTORY_NAME }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source
        run: python scripts/test_adf_source.py
      - name: Check QA settings
        shell: bash
        run: |
          set -euo pipefail
          for name in DEV_FACTORY_RESOURCE_ID QA_ADF_RESOURCE_GROUP QA_ADF_FACTORY_NAME AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            test -n "${!name}" || { echo "Missing QA environment setting: $name"; exit 1; }
          done
          test "$QA_ADF_FACTORY_NAME" != "${DEV_FACTORY_RESOURCE_ID##*/}"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Export reviewed ADF source
        working-directory: ci/adf
        env:
          DEV_FACTORY_RESOURCE_ID: ${{ vars.DEV_FACTORY_RESOURCE_ID }}
        run: |
          npm install --no-audit --no-fund
          npm run build -- export ../../adf "$DEV_FACTORY_RESOURCE_ID" ../../build/adf
      - name: Prepare QA ARM parameters
        run: |
          # The exported ARM template stays untouched; QA values come from deploy/adf-qa.parameters.json.
          python scripts/prepare_adf_parameters.py \
            --source-root adf \
            --template build/adf/ARMTemplateForFactory.json \
            --configuration deploy/adf-qa.parameters.json \
            --factory-name "$QA_ADF_FACTORY_NAME" \
            --output build/adf/adf-qa.parameters.json
      - name: Validate and deploy QA ADF
        run: |
          az deployment group validate \
            --resource-group "$QA_ADF_RESOURCE_GROUP" \
            --template-file build/adf/ARMTemplateForFactory.json \
            --parameters @build/adf/adf-qa.parameters.json
          az deployment group create \
            --resource-group "$QA_ADF_RESOURCE_GROUP" \
            --mode Incremental \
            --template-file build/adf/ARMTemplateForFactory.json \
            --parameters @build/adf/adf-qa.parameters.json
