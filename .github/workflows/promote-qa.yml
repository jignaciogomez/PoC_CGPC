name: Deploy reviewed QA branch

on:
  push:
    branches: [QA]
  workflow_dispatch:
    inputs:
      run_smoke_test:
        description: Run the ADF pipeline after deployment
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: qa-promotion
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/QA'
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source
        run: python scripts/check_example.py
      - name: Check required QA settings
        env:
          DEV_FACTORY_RESOURCE_ID: ${{ vars.DEV_FACTORY_RESOURCE_ID }}
          QA_ADF_RESOURCE_GROUP: ${{ vars.QA_ADF_RESOURCE_GROUP }}
          QA_ADF_FACTORY_NAME: ${{ vars.QA_ADF_FACTORY_NAME }}
          QA_DATABRICKS_CLUSTER_ID: ${{ vars.QA_DATABRICKS_CLUSTER_ID }}
          QA_DATABRICKS_TOKEN_SECRET_URL: ${{ vars.QA_DATABRICKS_TOKEN_SECRET_URL }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          for name in DEV_FACTORY_RESOURCE_ID QA_ADF_RESOURCE_GROUP QA_ADF_FACTORY_NAME QA_DATABRICKS_CLUSTER_ID QA_DATABRICKS_TOKEN_SECRET_URL DATABRICKS_CLIENT_ID DATABRICKS_CLIENT_SECRET; do
            test -n "${!name}" || { echo "Missing QA environment setting: $name"; exit 1; }
          done
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Export ADF ARM template from reviewed source
        working-directory: ci/adf
        env:
          DEV_FACTORY_RESOURCE_ID: ${{ vars.DEV_FACTORY_RESOURCE_ID }}
        run: |
          npm install --no-audit --no-fund
          npm run build -- export ../../adf "$DEV_FACTORY_RESOURCE_ID" ../../build/adf
      - uses: databricks/setup-cli@v1.10.0
      - name: Deploy QA Databricks bundle
        working-directory: databricks
        env:
          DATABRICKS_HOST: https://dbc-db5836d9-ab81.cloud.databricks.com
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          BUNDLE_VAR_cluster_id: ${{ vars.QA_DATABRICKS_CLUSTER_ID }}
        run: |
          databricks bundle validate -t qa
          databricks bundle deploy -t qa
          databricks bundle summary -t qa --output json > ../build/bundle-qa-summary.json
      - name: Build QA ADF parameter file
        env:
          QA_ADF_FACTORY_NAME: ${{ vars.QA_ADF_FACTORY_NAME }}
          QA_DATABRICKS_TOKEN_SECRET_URL: ${{ vars.QA_DATABRICKS_TOKEN_SECRET_URL }}
        run: |
          JOB_ID=$(python -c "import json; print(json.load(open('build/bundle-qa-summary.json'))['resources']['jobs']['load_random_users']['id'])")
          python scripts/make_adf_parameters.py \
            --template build/adf/ARMTemplateForFactory.json \
            --output build/adf/qa.parameters.json \
            --factory-name "$QA_ADF_FACTORY_NAME" \
            --workspace-host https://dbc-db5836d9-ab81.cloud.databricks.com \
            --job-id "$JOB_ID" \
            --token-secret-url "$QA_DATABRICKS_TOKEN_SECRET_URL"
      - name: Deploy QA ADF live resources
        env:
          QA_ADF_RESOURCE_GROUP: ${{ vars.QA_ADF_RESOURCE_GROUP }}
        run: |
          az deployment group create \
            --resource-group "$QA_ADF_RESOURCE_GROUP" \
            --template-file build/adf/ARMTemplateForFactory.json \
            --parameters @build/adf/qa.parameters.json
      - name: Optional QA pipeline smoke run
        if: inputs.run_smoke_test
        env:
          QA_ADF_RESOURCE_GROUP: ${{ vars.QA_ADF_RESOURCE_GROUP }}
          QA_ADF_FACTORY_NAME: ${{ vars.QA_ADF_FACTORY_NAME }}
        run: |
          RUN_ID=$(az datafactory pipeline create-run \
            --resource-group "$QA_ADF_RESOURCE_GROUP" \
            --factory-name "$QA_ADF_FACTORY_NAME" \
            --name PL_LoadRandomUsers \
            --query runId --output tsv)
          for attempt in $(seq 1 40); do
            STATUS=$(az datafactory pipeline-run show \
              --resource-group "$QA_ADF_RESOURCE_GROUP" \
              --factory-name "$QA_ADF_FACTORY_NAME" \
              --run-id "$RUN_ID" --query status --output tsv)
            echo "ADF run $RUN_ID: $STATUS"
            case "$STATUS" in
              Succeeded) exit 0 ;;
              Failed|Cancelled) exit 1 ;;
            esac
            sleep 30
          done
          echo "ADF run did not finish within 20 minutes"
          exit 1
