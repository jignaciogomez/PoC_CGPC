name: Deploy reviewed QA branch

on:
  push:
    branches: [QA]
  workflow_dispatch:
    inputs:
      run_smoke_test:
        description: Run the ADF pipeline after deployment
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: qa-promotion
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/QA'
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source
        run: python scripts/check_example.py
      - name: Check required environment settings
        env:
          DEV_FACTORY_RESOURCE_ID: ${{ vars.DEV_FACTORY_RESOURCE_ID }}
          QA_ADF_RESOURCE_GROUP: ${{ vars.QA_ADF_RESOURCE_GROUP }}
          QA_ADF_FACTORY_NAME: ${{ vars.QA_ADF_FACTORY_NAME }}
          QA_DATABRICKS_HOST: ${{ vars.QA_DATABRICKS_HOST }}
          QA_DATABRICKS_WORKSPACE_RESOURCE_ID: ${{ vars.QA_DATABRICKS_WORKSPACE_RESOURCE_ID }}
          QA_DATABRICKS_CLUSTER_ID: ${{ vars.QA_DATABRICKS_CLUSTER_ID }}
        run: |
          for name in DEV_FACTORY_RESOURCE_ID QA_ADF_RESOURCE_GROUP QA_ADF_FACTORY_NAME QA_DATABRICKS_HOST QA_DATABRICKS_WORKSPACE_RESOURCE_ID QA_DATABRICKS_CLUSTER_ID; do
            test -n "${!name}" || { echo "Missing GitHub environment variable: $name"; exit 1; }
          done
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Export ADF ARM template from reviewed source
        working-directory: ci/adf
        env:
          DEV_FACTORY_RESOURCE_ID: ${{ vars.DEV_FACTORY_RESOURCE_ID }}
        run: |
          npm install --no-audit --no-fund
          npm run build -- export ../../adf "$DEV_FACTORY_RESOURCE_ID" ../../build/adf
      - uses: databricks/setup-cli@v1.10.0
      - name: Validate and deploy QA Databricks bundle
        working-directory: databricks
        env:
          DATABRICKS_AUTH_TYPE: azure-cli
          DATABRICKS_HOST: ${{ vars.QA_DATABRICKS_HOST }}
          BUNDLE_VAR_cluster_id: ${{ vars.QA_DATABRICKS_CLUSTER_ID }}
        run: |
          databricks bundle validate -t qa --output json > ../build/bundle-qa.json
          databricks bundle deploy -t qa
      - name: Prepare QA ADF parameters from exported template
        env:
          QA_ADF_FACTORY_NAME: ${{ vars.QA_ADF_FACTORY_NAME }}
          QA_DATABRICKS_HOST: ${{ vars.QA_DATABRICKS_HOST }}
          QA_DATABRICKS_WORKSPACE_RESOURCE_ID: ${{ vars.QA_DATABRICKS_WORKSPACE_RESOURCE_ID }}
          QA_DATABRICKS_CLUSTER_ID: ${{ vars.QA_DATABRICKS_CLUSTER_ID }}
        run: |
          NOTEBOOK_PATH=$(python -c "import json; print(json.load(open('build/bundle-qa.json'))['resources']['jobs']['load_orders']['tasks'][0]['notebook_task']['notebook_path'])")
          python scripts/make_adf_parameters.py \
            --template build/adf/ARMTemplateForFactory.json \
            --output build/adf/qa.parameters.json \
            --factory-name "$QA_ADF_FACTORY_NAME" \
            --workspace-host "$QA_DATABRICKS_HOST" \
            --workspace-resource-id "$QA_DATABRICKS_WORKSPACE_RESOURCE_ID" \
            --cluster-id "$QA_DATABRICKS_CLUSTER_ID" \
            --notebook-path "$NOTEBOOK_PATH" \
            --catalog qa_bronze_ca
      - name: Deploy QA ADF live resources
        env:
          QA_ADF_RESOURCE_GROUP: ${{ vars.QA_ADF_RESOURCE_GROUP }}
        run: |
          az deployment group create \
            --resource-group "$QA_ADF_RESOURCE_GROUP" \
            --template-file build/adf/ARMTemplateForFactory.json \
            --parameters @build/adf/qa.parameters.json
      - name: Optional QA pipeline smoke run
        if: inputs.run_smoke_test
        env:
          QA_ADF_RESOURCE_GROUP: ${{ vars.QA_ADF_RESOURCE_GROUP }}
          QA_ADF_FACTORY_NAME: ${{ vars.QA_ADF_FACTORY_NAME }}
        run: |
          RUN_ID=$(az datafactory pipeline create-run \
            --resource-group "$QA_ADF_RESOURCE_GROUP" \
            --factory-name "$QA_ADF_FACTORY_NAME" \
            --name PL_LoadOrders \
            --parameters process_date=2026-01-01 \
            --query runId --output tsv)
          for attempt in $(seq 1 30); do
            STATUS=$(az datafactory pipeline-run show \
              --resource-group "$QA_ADF_RESOURCE_GROUP" \
              --factory-name "$QA_ADF_FACTORY_NAME" \
              --run-id "$RUN_ID" --query status --output tsv)
            echo "ADF run $RUN_ID: $STATUS"
            case "$STATUS" in
              Succeeded) exit 0 ;;
              Failed|Cancelled) exit 1 ;;
            esac
            sleep 20
          done
          echo "ADF run did not finish within ten minutes"
          exit 1
