name: Deploy and smoke-test QA ADF

on:
  push:
    branches: [QA]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: qa-promotion
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/QA'
    runs-on: ubuntu-latest
    environment: qa
    env:
      DEV_FACTORY_RESOURCE_ID: ${{ vars.DEV_FACTORY_RESOURCE_ID }}
      QA_ADF_RESOURCE_GROUP: ${{ vars.QA_ADF_RESOURCE_GROUP }}
      QA_ADF_FACTORY_NAME: ${{ vars.QA_ADF_FACTORY_NAME }}
      QA_ADLS_ACCOUNT_NAME: ${{ vars.QA_ADLS_ACCOUNT_NAME }}
      QA_ADLS_FILE_SYSTEM: ${{ vars.QA_ADLS_FILE_SYSTEM }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source
        run: |
          python scripts/check_example.py
          python scripts/test_qa_adf_template.py
      - name: Check QA settings
        shell: bash
        run: |
          set -euo pipefail
          for name in DEV_FACTORY_RESOURCE_ID QA_ADF_RESOURCE_GROUP QA_ADF_FACTORY_NAME QA_ADLS_ACCOUNT_NAME QA_ADLS_FILE_SYSTEM AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            test -n "${!name}" || { echo "Missing QA environment setting: $name"; exit 1; }
          done
          test "$QA_ADF_FACTORY_NAME" != dev-cgpc-poc
          test "$QA_ADLS_ACCOUNT_NAME" != devcgpcpocadls
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read QA factory location
        shell: bash
        run: |
          set -euo pipefail
          location=$(az datafactory show --resource-group "$QA_ADF_RESOURCE_GROUP" --name "$QA_ADF_FACTORY_NAME" --query location --output tsv)
          test -n "$location"
          echo "QA_FACTORY_LOCATION=$location" >> "$GITHUB_ENV"
      - name: Export reviewed ADF source
        working-directory: ci/adf
        env:
          DEV_FACTORY_RESOURCE_ID: ${{ vars.DEV_FACTORY_RESOURCE_ID }}
        run: |
          npm install --no-audit --no-fund
          npm run build -- export ../../adf "$DEV_FACTORY_RESOURCE_ID" ../../build/adf
      - name: Build QA ADF deployment artifact
        run: |
          python scripts/build_qa_adf_template.py \
            --template build/adf/ARMTemplateForFactory.json \
            --output-template build/adf/qa.template.json \
            --output-parameters build/adf/qa.parameters.json \
            --factory-name "$QA_ADF_FACTORY_NAME" \
            --location "$QA_FACTORY_LOCATION" \
            --storage-account "$QA_ADLS_ACCOUNT_NAME" \
            --filesystem "$QA_ADLS_FILE_SYSTEM"
      - name: Validate and deploy QA ADF
        run: |
          az deployment group validate \
            --resource-group "$QA_ADF_RESOURCE_GROUP" \
            --template-file build/adf/qa.template.json \
            --parameters @build/adf/qa.parameters.json
          az deployment group create \
            --resource-group "$QA_ADF_RESOURCE_GROUP" \
            --template-file build/adf/qa.template.json \
            --parameters @build/adf/qa.parameters.json
      - name: Smoke-test QA ADF ingestion
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(az datafactory pipeline create-run \
            --resource-group "$QA_ADF_RESOURCE_GROUP" \
            --factory-name "$QA_ADF_FACTORY_NAME" \
            --name PL_LoadRandomUsers \
            --query runId --output tsv)
          for attempt in $(seq 1 40); do
            status=$(az datafactory pipeline-run show \
              --resource-group "$QA_ADF_RESOURCE_GROUP" \
              --factory-name "$QA_ADF_FACTORY_NAME" \
              --run-id "$run_id" --query status --output tsv)
            echo "ADF run $run_id: $status"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Cancelled) exit 1 ;;
            esac
            sleep 15
          done
          echo "ADF run did not finish within 10 minutes"
          exit 1
      - name: Confirm QA landing file exists
        run: |
          az storage fs file show \
            --account-name "$QA_ADLS_ACCOUNT_NAME" \
            --file-system "$QA_ADLS_FILE_SYSTEM" \
            --path landing/users.json \
            --auth-mode login \
            --output none
