name: Validate Databricks promotion source

on:
  pull_request:
    branches: [Dev, QA, Prod]
    paths:
      - databricks/**
      - scripts/check_databricks_target.py
      - scripts/test_databricks_source.py
      - .github/workflows/*databricks*.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6,<7'
      - run: python scripts/test_databricks_source.py
